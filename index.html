<!-- Login con Google -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- Firebase: Auth (para vincular el login de Google) + Firestore (base de datos) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithCredential, signOut } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";
  import {
    getFirestore, collection, getDocs, doc, setDoc, deleteDoc, writeBatch
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCcFmq6ZGLtmhlQKpypY1BBo0d7EMeMRfQ",
    authDomain: "app-pedidos-b96ac.firebaseapp.com",
    projectId: "app-pedidos-b96ac",
    storageBucket: "app-pedidos-b96ac.firebasestorage.app",
    messagingSenderId: "1031734419080",
    appId: "1:1031734419080:web:3b96162c9e6cfbcc18893d"
  };

  const firebaseApp = initializeApp(firebaseConfig);
  const firebaseAuth = getAuth(firebaseApp);
  const db = getFirestore(firebaseApp);

  // Expuestos en window porque el resto del código (fuera de este módulo)
  // todavía es JS clásico, no un módulo — así lo puede usar sin import.
  window.firebaseSignOut = () => signOut(firebaseAuth);

  // Toma el id_token que ya devuelve el login de Google (Google Identity
  // Services) y lo usa para autenticar TAMBIÉN contra Firebase, sin pedir
  // un segundo login. Así, request.auth en las reglas de Firestore queda
  // disponible usando el mismo botón de Google que ya tenías.
  window.firebaseSignInConCredencialGoogle = async (idToken) => {
    const credential = GoogleAuthProvider.credential(idToken);
    return signInWithCredential(firebaseAuth, credential);
  };

  async function leerColeccion(nombre){
    const snap = await getDocs(collection(db, nombre));
    const out = [];
    snap.forEach(d => out.push({ id: d.id, ...d.data() }));
    return out;
  }

  window.firestoreLeerClientes = () => leerColeccion('clientes');
  window.firestoreLeerChoferes = () => leerColeccion('choferes');

  // setDoc con merge:true → solo pisa los campos que se pasan en "datos",
  // sin tocar el resto del documento (mismo comportamiento que antes tenía
  // Código.gs al editar una sola columna del Sheet).
  window.firestoreGuardarCliente = async (id, datos) => {
    await setDoc(doc(db, 'clientes', id), datos, { merge: true });
  };
  window.firestoreEliminarCliente = async (id) => {
    await deleteDoc(doc(db, 'clientes', id));
  };
  window.firestoreGuardarChofer = async (id, datos) => {
    await setDoc(doc(db, 'choferes', id), datos, { merge: true });
  };
  window.firestoreEliminarChofer = async (id) => {
    await deleteDoc(doc(db, 'choferes', id));
  };

  // Actualiza varios documentos de "clientes" a la vez en una sola
  // operación atómica (se usa para "Vaciar cantidades" y "Marcar enviados").
  window.firestoreActualizarClientesEnLote = async (actualizaciones) => {
    const batch = writeBatch(db);
    actualizaciones.forEach(({ id, datos }) => {
      batch.set(doc(db, 'clientes', id), datos, { merge: true });
    });
    await batch.commit();
  };
</script>

<style>
  :root{
    --azul-osc: #16305c;
    --azul: #2a5cc9;

  .icon-btn.active{ background:var(--azul); color:#fff; border-color:var(--azul); }
  .icon-btn.hidden{ display:none; }
  .header-actions{ display:flex; gap:8px; }

  .pill-tabs{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px;
    background:#fff; border:1px solid var(--azul-borde);
    border-radius:14px; padding:4px;
    margin:14px 20px 0; flex-shrink:0;
    box-shadow:0 1px 3px rgba(22,48,92,0.05);
  }
  .pill-tabs button{

  .pill-tabs button.active{ background:var(--azul); color:#fff; box-shadow:0 2px 6px rgba(42,92,201,0.35); }

  .search-wrap{ padding:12px 20px 6px; flex-shrink:0; }
  .search-wrap.hidden{ display:none; }
  .search-wrap input{
    width:100%; padding:11px 13px; border-radius:11px; border:1px solid var(--azul-borde);
    background:#fff; font-size:16px; outline:none; color:#1a1f2b;

  .cliente-card.cargado{ border-color:var(--azul-borde); background:var(--azul-suave); }

    flex:1; background:#fff; color:var(--rojo); border:1px solid #f5d6d2;
    padding:13px; border-radius:13px; font-size:14.5px; font-weight:800; cursor:pointer;

  /* Modal genérico */
  .modal-overlay{
    position:fixed; inset:0; z-index:200;
    background:rgba(17,22,36,0.55);
    display:flex; align-items:flex-start; justify-content:center;
  }
  .modal-overlay.hidden{ display:none; }
  .modal-box{
    width:100%; max-width:520px; max-height:88vh; margin:0 14px; margin-top:6vh;
    background:#fff; border-radius:18px;
    display:flex; flex-direction:column;
    box-shadow:0 12px 32px rgba(17,22,36,0.28);
  }
  .modal-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px 14px; border-bottom:1px solid var(--linea); flex-shrink:0;
  }
  .modal-header h3{ margin:0; font-size:18px; font-weight:800; color:#111624; }
  .modal-header .modal-sub{ font-size:12.5px; color:var(--texto-tenue); font-weight:600; margin-top:2px; }
  .modal-close{ background:none; border:none; font-size:26px; line-height:1; cursor:pointer; color:var(--texto-tenue); padding:4px 8px; }
  .modal-body{ padding:16px 20px 8px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .modal-body label{ display:block; font-size:14px; font-weight:800; color:var(--azul-osc); margin:14px 0 6px; }
  .modal-body label:first-of-type{ margin-top:0; }
  .modal-body input[type="text"],
  .modal-body input[type="tel"]{
    width:100%; padding:12px 13px; border-radius:12px; border:1px solid var(--azul-borde);
    background:#fff; font-size:16px; outline:none; color:#1a1f2b;
  }
  .modal-body input:focus{ border-color:var(--azul); }
  .modal-error{ padding:0 20px; color:var(--rojo); font-size:13.5px; font-weight:600; min-height:18px; }
  .modal-footer{ display:flex; gap:10px; padding:14px 20px 20px; flex-shrink:0; border-top:1px solid var(--linea); }
  .modal-footer button{ flex:1; padding:14px; border-radius:13px; border:none; font-size:15.5px; font-weight:700; cursor:pointer; }

  .estado-btn.selected.enviado{ background:var(--verde); border-color:var(--verde); }

  .reparto-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .reparto-btn{
    border:1px solid var(--azul-borde); background:#fff; cursor:pointer;
    padding:12px 8px; border-radius:12px; font-size:14px; font-weight:700; color:var(--texto-tenue);
  }
  .reparto-btn.selected{ background:var(--azul); color:#fff; border-color:var(--azul); }

  /* Confirmación */
  #confirm-modal{
    position:fixed; inset:0; z-index:250;
    background:rgba(17,22,36,0.55);
    display:flex; align-items:center; justify-content:center; padding:24px;

  .confirm-box .confirm-icon svg{ width:24px; height:24px; }
  .confirm-box h3{ font-size:17px; margin:0 0 6px; color:#111624; font-weight:800; }
  .confirm-box p{ font-size:14px; color:var(--texto-tenue); margin:0 0 20px; line-height:1.4; }
  .confirm-box .confirm-actions{ display:flex; gap:10px; }
  .confirm-box button{ flex:1; padding:12px; border-radius:12px; border:none; font-size:15px; font-weight:700; cursor:pointer; }
  .confirm-box .btn-confirmar{ background:var(--rojo); color:#fff; }
  .confirm-box .btn-confirmar:active{ opacity:0.85; }

  /* Login */
  #login-screen{
    position:fixed; inset:0; z-index:300; background:var(--fondo);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center;
  }
  #login-screen.hidden{ display:none; }
  #login-screen h1{ font-size:24px; margin:0 0 4px; color:#111624; font-weight:800; }
  #login-screen .sub{ font-size:14px; color:var(--azul); font-weight:700; margin-bottom:32px; }
  #login-screen .login-error{ color:var(--rojo); font-size:13.5px; font-weight:600; margin-top:18px; max-width:300px; min-height:18px; }
  #login-screen .login-checking{ color:var(--texto-tenue); font-size:14px; }
  #login-screen .login-hint{ color:var(--texto-tenue); font-size:13px; margin-top:12px; max-width:260px; }
  #google-btn-container{ min-height:44px; }
</style>
</head>

  <div class="confirm-box">
    <div class="confirm-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>

<script>
/* ============== CONFIGURACIÓN ============== */
const CONFIG = {

  EMAILS_AUTORIZADOS: [

  // Productos: "codigo" tiene que ser EXACTO al encabezado de la

  // "unidad": unidad de medida del producto (se muestra en el mensaje de WhatsApp).
  // "pesoUnitario": SOLO para productos que se cargan por bolsa/cajón (no en kg

/* ============== LOGIN CON GOOGLE ============== */
const LOGIN_STORAGE_KEY = 'pedidos_pollo_login';

const loginScreen = document.getElementById('login-screen');
const loginChecking = document.getElementById('login-checking');
const googleBtnContainer = document.getElementById('google-btn-container');
const loginError = document.getElementById('login-error');
const loginHint = document.getElementById('login-hint');
const btnLogout = document.getElementById('btn-logout');

function decodeJwt_(token){
  try{
    const base64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    const json = decodeURIComponent(atob(base64).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
    ).join(''));
    return JSON.parse(json);
  }catch(err){ return null; }
}

function sesionGuardada(){
  try{
    const raw = localStorage.getItem(LOGIN_STORAGE_KEY);
    if(!raw) return null;
    const datos = JSON.parse(raw);
    if(!datos.token || !datos.exp) return null;
    if(Date.now() / 1000 > datos.exp - 60) return null;
    return datos;
  }catch(err){ return null; }
}

function guardarSesion(token, payload){
  localStorage.setItem(LOGIN_STORAGE_KEY, JSON.stringify({ token, email: payload.email, exp: payload.exp }));
}

function cerrarSesion(){
  localStorage.removeItem(LOGIN_STORAGE_KEY);
  if(window.google && google.accounts && google.accounts.id){
    google.accounts.id.disableAutoSelect();
  }
  if(window.firebaseSignOut){ window.firebaseSignOut().catch(() => {}); }
  mostrarLogin();
}

function tokenActual(){
  const sesion = sesionGuardada();
  return sesion ? sesion.token : null;
}

function mostrarLogin(){
  document.getElementById('app').style.display = 'none';
  loginScreen.classList.remove('hidden');
  loginChecking.style.display = 'none';
  googleBtnContainer.style.display = 'block';
  loginHint.style.display = 'block';
  loginError.textContent = '';
}

function ocultarLogin(){
  loginScreen.classList.add('hidden');
  loginHint.style.display = 'none';
  document.getElementById('app').style.display = '';
}

// Autentica contra Firebase con el mismo id_token de Google (sin pedir un
// segundo login), y recién ahí entra a la app: sin esto, Firestore rechaza
// todas las lecturas/escrituras porque request.auth queda vacío.
function autenticarFirebaseYEntrar(token){
  if(!window.firebaseSignInConCredencialGoogle){ ocultarLogin(); cargarDatos(); return; }
  window.firebaseSignInConCredencialGoogle(token).then(() => {
    ocultarLogin();
    cargarDatos();
  }).catch((err) => {
    cerrarSesion();
    loginError.textContent = 'No se pudo autenticar con Firebase. ' + (err && err.message ? err.message : '');
  });
}

function manejarCredencial(response){
  const payload = decodeJwt_(response.credential);
  if(!payload){ loginError.textContent = 'No se pudo leer la respuesta de Google.'; return; }
  const email = String(payload.email || '').trim().toLowerCase();
  const autorizados = CONFIG.EMAILS_AUTORIZADOS.map(e => e.toLowerCase());
  if(autorizados.indexOf(email) === -1){
    loginError.textContent = 'Tu cuenta (' + email + ') no tiene acceso a esta app.';
    return;
  }
  guardarSesion(response.credential, payload);
  autenticarFirebaseYEntrar(response.credential);
}

function iniciarLogin(){
  if(!window.google || !google.accounts || !google.accounts.id){
    setTimeout(iniciarLogin, 300);
    return;
  }
  // auto_select: si el navegador tiene una sola cuenta de Google ya usada
  // antes en esta app, google.accounts.id.prompt() de más abajo entra
  // directo, sin mostrar ningún selector ni pedir un click.
  google.accounts.id.initialize({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    callback: manejarCredencial,
    auto_select: true,
    itp_support: true
  });
  google.accounts.id.renderButton(googleBtnContainer, { type:'standard', size:'large', theme:'filled_blue', text:'signin_with', shape:'pill' });

  const sesion = sesionGuardada();
  if(sesion){
    // Mismo corte inmediato que en manejarCredencial: si el email guardado
    // ya no está en la lista (por ejemplo, se lo dio de baja), no lo
    // dejamos entrar con la sesión vieja.
    const emailSesion = String(sesion.email || '').trim().toLowerCase();
    const autorizados = CONFIG.EMAILS_AUTORIZADOS.map(e => e.toLowerCase());
    if(autorizados.indexOf(emailSesion) === -1){
      cerrarSesion();
      loginError.textContent = 'Tu cuenta (' + emailSesion + ') no tiene acceso a esta app.';
      return;
    }
    autenticarFirebaseYEntrar(sesion.token);
  } else {
    mostrarLogin();
    // One Tap: intenta el login automático (silencioso) con la última
    // cuenta usada. Si el navegador no tiene una cuenta para ofrecer, o
    // el usuario ya lo cerró antes, simplemente no aparece nada y queda
    // el botón de abajo como alternativa manual (esa sí deja elegir
    // "usar otra cuenta").
    google.accounts.id.prompt();
  }
}

btnLogout.addEventListener('click', () => { if(confirm('¿Cerrar sesión?')) cerrarSesion(); });

let pedidos = [];
let repartos = [];

const mainEl = document.getElementById('main');

async function cargarDatos(){
  btnRefresh.classList.add('spinning');
  try{
    const [clientesDocs, choferesDocs] = await Promise.all([
      window.firestoreLeerClientes(),
      window.firestoreLeerChoferes()
    ]);
    pedidos = clientesDocs;
    repartos = choferesDocs;
    render();
  }catch(err){
    if(err && err.code === 'permission-denied'){
      cerrarSesion();
      loginError.textContent = 'Esta cuenta no tiene acceso a los datos, o la sesión venció. Iniciá sesión de nuevo.';
      return;
    }
    mainEl.innerHTML = `<div class="state-msg error">No se pudieron cargar los datos.<br>${err.message}</div>`;
  }finally{
    btnRefresh.classList.remove('spinning');
  }
}

function escapeHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Formatea "CODIGO cantidad" agregando la unidad de medida del producto.
// - Si tiene "pesoUnitario" (se carga por bolsa), muestra el total en kilos: "MED 3 (15 kg)".
// - Si es "kg" directo (sin pesoUnitario), muestra el número tal cual: "CTO 45 kg".
// - Si es "caj" (cajones), muestra "POLLO 3 caj".
// - Si no tiene unidad (ej. UNID), muestra solo el número: "UNID 5".
function formatearItemProducto(p, cantidad){
  if(p.unidad === 'kg' && p.pesoUnitario){
    return `${p.label} ${cantidad} (${cantidad * p.pesoUnitario} kg)`;
  }
  if(p.unidad){
    return `${p.label} ${cantidad} ${p.unidad}`;
  }
  return `${p.label} ${cantidad}`;
}

function tieneCantidades(cliente){
  return CONFIG.PRODUCTOS.some(p => Number(cliente[p.codigo]) > 0);
}

/* ============== RENDER ============== */
function render(){
  const term = filtro.trim().toLowerCase();
  const filtrados = pedidos.filter(p =>
    !term || String(p.Cliente||'').toLowerCase().includes(term) || String(p.Localidad||'').toLowerCase().includes(term)
  );

  barraAcciones.classList.toggle('hidden', currentTab !== 'pedido');
  fabNuevo.classList.toggle('hidden', currentTab === 'pedido');
  btnOcultarVacios.classList.toggle('hidden', currentTab !== 'pedido');
  btnOcultarVacios.classList.toggle('active', ocultarVacios);

  if(currentTab === 'pedido') renderPedido(filtrados);
  else if(currentTab === 'clientes') renderClientes(filtrados);
  else renderChoferes();
}

    const conCantidad = clientes.filter(tieneCantidades);
    const pendientes = conCantidad.filter(c => String(c.Estado || '').toLowerCase() !== 'enviado');
    const repartoInfo = repartos.find(r => String(r.Reparto||'').trim() === reparto);
    const puedeEnviar = pendientes.length > 0 && repartoInfo && repartoInfo.WhatsApp;
    const colapsado = gruposColapsados.has(reparto);

    // Si está activo "ocultar vacíos", sacamos los clientes sin cantidades cargadas (badge "Vacío")
    const clientesVisibles = ocultarVacios ? clientes.filter(c => tieneCantidades(c) || String(c.Estado||'').toLowerCase() === 'enviado') : clientes;
    if(!clientesVisibles.length) return;

    html += `<div class="grupo">
      <div class="grupo-header">
        <button type="button" class="grupo-titulo-btn ${colapsado ? 'colapsado' : ''}" data-reparto="${escapeHtml(reparto)}">

          Enviar
        </button>
      </div>
      <div class="grupo-clientes ${colapsado ? 'colapsado' : ''}">`;
    clientesVisibles.forEach(c => {
      const cargado = tieneCantidades(c);
      const enviado = String(c.Estado || '').toLowerCase() === 'enviado';
      let badge = '<span class="cliente-badge vacio">Vacío</span>';
      if(enviado) badge = '<span class="cliente-badge enviado">Enviado</span>';
      else if(cargado) badge = '<span class="cliente-badge">Pendiente</span>';
      html += `<div class="cliente-card ${cargado ? 'cargado' : ''}" data-cliente="${escapeHtml(c.Cliente)}">
        <div class="cliente-info">
          <div class="cliente-nombre">${escapeHtml(c.Cliente)}</div>
          <div class="cliente-sub">${escapeHtml(c.Localidad || 'Sin localidad')}</div>

        ${badge}
      </div>`;
    });
    html += `</div></div>`;
  });

  if(!huboGrupos){
    mainEl.innerHTML = `<div class="state-msg">No hay clientes pendientes (todos están vacíos). Desactivá el filtro para verlos.</div>`;
    return;
  }

  mainEl.innerHTML = html;

  mainEl.querySelectorAll('.cliente-card').forEach(el => {
    el.addEventListener('click', () => abrirCantidades(el.dataset.cliente));
  });
  mainEl.querySelectorAll('.btn-enviar-reparto').forEach(el => {
    el.addEventListener('click', () => enviarReparto(el.dataset.reparto));
  });
  mainEl.querySelectorAll('.grupo-titulo-btn').forEach(el => {
    el.addEventListener('click', () => {
      const reparto = el.dataset.reparto;
      if(gruposColapsados.has(reparto)) gruposColapsados.delete(reparto);
      else gruposColapsados.add(reparto);
      render();

function renderClientes(lista){

    mainEl.innerHTML = `<div class="state-msg">No hay clientes cargados. Tocá el botón + para agregar el primero.</div>`;

  mainEl.innerHTML = html;

  const actual = hiddenInput.value;
  gridEl.innerHTML = REPARTOS_OPCIONES.map(r => `
    <button type="button" class="reparto-btn ${actual === r ? 'selected' : ''}" data-valor="${escapeHtml(r)}">${escapeHtml(r)}</button>
  `).join('');
  gridEl.querySelectorAll('.reparto-btn').forEach(btn => {
    btn.addEventListener('click', () => { hiddenInput.value = btn.dataset.valor; renderRepartoBotones(gridEl, hiddenInput); });
  });
}

function abrirCantidades(nombreCliente){
  const c = pedidos.find(p => p.Cliente === nombreCliente);
  if(!c) return;
  cantClienteId.value = nombreCliente;
  cantTitulo.textContent = c.Cliente;
  cantSub.textContent = [c.Reparto, c.Localidad].filter(Boolean).join(' · ');
  cantError.textContent = '';

  const primeraFila = CONFIG.PRODUCTOS.slice(0, 2);
  const resto = CONFIG.PRODUCTOS.slice(2);
  const itemHtml = p => {
    const val = c[p.codigo];
    const valStr = (val === undefined || val === null || val === '') ? '' : String(val);
    return `<div class="producto-item">
      <label>${escapeHtml(p.label)}</label>
      <input type="number" inputmode="numeric" min="0" step="1" placeholder="0" data-codigo="${p.codigo}" value="${escapeHtml(valStr)}">
    </div>`;
  };
  cantGrid.innerHTML =
    `<div class="productos-grid">${primeraFila.map(itemHtml).join('')}</div>` +
    `<div class="productos-grid col-3">${resto.map(itemHtml).join('')}</div>`;

  const estadoActual = c.Estado || '';
  cantEstadoValor.value = estadoActual;
  renderEstadoBotones();

  cantModal.classList.remove('hidden');
}

function renderEstadoBotones(){
  const actual = cantEstadoValor.value;
  cantEstadoGrid.innerHTML = ESTADOS.map(e => `
    <button type="button" class="estado-btn ${actual === e.valor ? 'selected ' + (e.valor==='Enviado'?'enviado':'') : ''}" data-valor="${escapeHtml(e.valor)}">${e.label}</button>
  `).join('');
  cantEstadoGrid.querySelectorAll('.estado-btn').forEach(btn => {
    btn.addEventListener('click', () => { cantEstadoValor.value = btn.dataset.valor; renderEstadoBotones(); });
  });
}

document.getElementById('cant-cerrar').addEventListener('click', () => cantModal.classList.add('hidden'));
document.getElementById('cant-cancelar').addEventListener('click', () => cantModal.classList.add('hidden'));

document.getElementById('cant-guardar').addEventListener('click', async () => {
  const cliente = cantClienteId.value;
  const c = pedidos.find(p => p.Cliente === cliente);
  if(!c){ cantError.textContent = 'No se encontró el cliente'; return; }
  const cantidades = {};
  cantGrid.querySelectorAll('input').forEach(inp => {
    const v = inp.value.trim();
    cantidades[inp.dataset.codigo] = v === '' ? '' : Number(v);
  });
  const btn = document.getElementById('cant-guardar');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    const datos = Object.assign({}, cantidades, { Estado: cantEstadoValor.value });
    await window.firestoreGuardarCliente(c.id, datos);
    Object.assign(c, cantidades); c.Estado = cantEstadoValor.value;
    cantModal.classList.add('hidden');
    render();
  }catch(err){
    if(err && err.code === 'permission-denied'){ cantError.textContent = 'Tu cuenta no tiene permiso para hacer esto.'; return; }
    cantError.textContent = 'Error al guardar: ' + err.message;
  }finally{
    btn.disabled = false; btn.textContent = 'Guardar';
  }
});

/* ============== Modal cliente (nuevo/editar) ============== */
const clienteModal = document.getElementById('cliente-modal');
const ncTitulo = document.getElementById('nc-titulo');
const ncNombre = document.getElementById('nc-nombre');
const ncReparto = document.getElementById('nc-reparto');
const ncRepartoGrid = document.getElementById('nc-reparto-grid');
const ncLocalidad = document.getElementById('nc-localidad');
const ncContacto = document.getElementById('nc-contacto');
const ncNombreOriginal = document.getElementById('nc-nombre-original');
const ncError = document.getElementById('nc-error');
const ncFooter = document.getElementById('nc-footer');

fabNuevo.addEventListener('click', () => {
  if(currentTab === 'clientes') abrirNuevoCliente();
  else if(currentTab === 'choferes') abrirNuevoChofer();
});

function abrirNuevoCliente(){
  ncTitulo.textContent = 'Nuevo cliente';
  ncNombreOriginal.value = '';
  ncNombre.value = ''; ncReparto.value = ''; ncLocalidad.value = ''; ncContacto.value = '';
  renderRepartoBotones(ncRepartoGrid, ncReparto);
  ncError.textContent = '';
  ncNombre.disabled = false;
  ncFooter.innerHTML = `<button class="btn-cancelar" id="nc-cancelar-btn">Cancelar</button><button class="btn-guardar" id="nc-guardar">Guardar</button>`;
  reengancharFooterCliente();
  clienteModal.classList.remove('hidden');
}

function abrirEditarCliente(nombreCliente){
  const c = pedidos.find(p => p.Cliente === nombreCliente);
  if(!c) return;
  ncTitulo.textContent = 'Editar cliente';
  ncNombreOriginal.value = c.Cliente;
  ncNombre.value = c.Cliente || '';
  ncReparto.value = c.Reparto || '';
  renderRepartoBotones(ncRepartoGrid, ncReparto);
  ncLocalidad.value = c.Localidad || '';
  ncContacto.value = c.Contacto || '';
  ncError.textContent = '';
  ncFooter.innerHTML = `<button class="btn-eliminar-cliente" id="nc-eliminar">Eliminar</button><button class="btn-guardar" id="nc-guardar">Guardar</button>`;
  reengancharFooterCliente();
  clienteModal.classList.remove('hidden');
}

function reengancharFooterCliente(){
  const cancelar = document.getElementById('nc-cancelar-btn');
  if(cancelar) cancelar.addEventListener('click', () => clienteModal.classList.add('hidden'));
  const eliminar = document.getElementById('nc-eliminar');
  if(eliminar) eliminar.addEventListener('click', () => pedirConfirmacionEliminarCliente(ncNombreOriginal.value));
  document.getElementById('nc-guardar').addEventListener('click', guardarCliente);
}

document.getElementById('nc-cerrar').addEventListener('click', () => clienteModal.classList.add('hidden'));

async function guardarCliente(){
  const cliente = ncNombre.value.trim();
  if(!cliente){ ncError.textContent = 'Falta el nombre del cliente'; return; }
  const nombreOriginal = ncNombreOriginal.value;
  const existente = nombreOriginal ? pedidos.find(p => p.Cliente === nombreOriginal) : null;
  if(nombreOriginal && !existente){ ncError.textContent = 'No se encontró el cliente a editar'; return; }
  const duplicado = pedidos.find(p => p !== existente && String(p.Cliente||'').trim().toLowerCase() === cliente.toLowerCase());
  if(duplicado){ ncError.textContent = 'Ya existe otro cliente con ese nombre'; return; }

  const datos = {
    Cliente: cliente,
    Reparto: ncReparto.value.trim(),
    Localidad: ncLocalidad.value.trim(),
    Contacto: ncContacto.value.trim()
  };
  const id = existente ? existente.id : crypto.randomUUID().split('-')[0];

  const btn = document.getElementById('nc-guardar');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    await window.firestoreGuardarCliente(id, datos);
    aplicarClienteGuardado(Object.assign({}, existente, datos, { id }), nombreOriginal);
    clienteModal.classList.add('hidden');
    render();
  }catch(err){
    if(err && err.code === 'permission-denied'){ ncError.textContent = 'Tu cuenta no tiene permiso para hacer esto.'; return; }
    ncError.textContent = 'Error al guardar: ' + err.message;
  }finally{
    btn.disabled = false; btn.textContent = 'Guardar';
  }
}

// Actualiza el array local `pedidos` con la fila que ya devolvió el
// servidor, sin volver a pedir toda la hoja (mismo patrón que la app de
// Saldos, que por eso sincroniza rápido).
function aplicarClienteGuardado(clienteGuardado, nombreOriginal){
  if(!clienteGuardado) return;
  if(nombreOriginal){
    const idx = pedidos.findIndex(p => p.Cliente === nombreOriginal);
    if(idx >= 0) pedidos[idx] = clienteGuardado;
    else pedidos.push(clienteGuardado);
  }else{
    pedidos.push(clienteGuardado);
  }
}

/* ============== Modal chofer (nuevo/editar) ============== */
const choferModal = document.getElementById('chofer-modal');
const chTitulo = document.getElementById('ch-titulo');
const chReparto = document.getElementById('ch-reparto');
const chRepartoGrid = document.getElementById('ch-reparto-grid');
const chChofer = document.getElementById('ch-chofer');
const chWhatsapp = document.getElementById('ch-whatsapp');
const chRepartoOriginal = document.getElementById('ch-reparto-original');
const chError = document.getElementById('ch-error');
const chFooter = document.getElementById('ch-footer');

function abrirNuevoChofer(){
  chTitulo.textContent = 'Nuevo chofer';
  chRepartoOriginal.value = '';
  chReparto.value = ''; chChofer.value = ''; chWhatsapp.value = '';
  renderRepartoBotones(chRepartoGrid, chReparto);
  chError.textContent = '';
  chFooter.innerHTML = `<button class="btn-cancelar" id="ch-cancelar-btn">Cancelar</button><button class="btn-guardar" id="ch-guardar">Guardar</button>`;
  reengancharFooterChofer();
  choferModal.classList.remove('hidden');
}

function abrirEditarChofer(reparto){
  const r = repartos.find(x => String(x.Reparto) === String(reparto));
  if(!r) return;
  chTitulo.textContent = 'Editar chofer';
  chRepartoOriginal.value = r.Reparto;
  chReparto.value = r.Reparto || '';
  renderRepartoBotones(chRepartoGrid, chReparto);
  chChofer.value = r.Chofer || '';
  chWhatsapp.value = r.WhatsApp || '';
  chError.textContent = '';

  choferModal.classList.remove('hidden');
}

function reengancharFooterChofer(){
  const cancelar = document.getElementById('ch-cancelar-btn');
  if(cancelar) cancelar.addEventListener('click', () => choferModal.classList.add('hidden'));
  const eliminar = document.getElementById('ch-eliminar');
  if(eliminar) eliminar.addEventListener('click', () => pedirConfirmacionEliminarChofer(chRepartoOriginal.value));
  document.getElementById('ch-guardar').addEventListener('click', guardarChofer);
}

document.getElementById('ch-cerrar').addEventListener('click', () => choferModal.classList.add('hidden'));

async function guardarChofer(){
  const reparto = chReparto.value.trim();
  if(!reparto){ chError.textContent = 'Falta el Reparto'; return; }
  if(!chWhatsapp.value.trim()){ chError.textContent = 'Falta el WhatsApp del chofer'; return; }
  const repartoOriginal = chRepartoOriginal.value;
  const existente = repartoOriginal ? repartos.find(r => String(r.Reparto) === String(repartoOriginal)) : null;
  if(repartoOriginal && !existente){ chError.textContent = 'No se encontró el reparto a editar'; return; }
  const duplicado = repartos.find(r => r !== existente && String(r.Reparto||'').trim().toLowerCase() === reparto.toLowerCase());
  if(duplicado){ chError.textContent = 'Ya existe otro chofer cargado con ese Reparto'; return; }

  const datos = {
    Reparto: reparto,
    Chofer: chChofer.value.trim(),
    WhatsApp: chWhatsapp.value.trim()
  };
  const id = existente ? existente.id : crypto.randomUUID().split('-')[0];

  const btn = document.getElementById('ch-guardar');
  btn.disabled = true; btn.textContent = 'Guardando...';
  try{
    await window.firestoreGuardarChofer(id, datos);
    aplicarChoferGuardado(Object.assign({}, existente, datos, { id }), repartoOriginal);
    choferModal.classList.add('hidden');
    render();
  }catch(err){
    if(err && err.code === 'permission-denied'){ chError.textContent = 'Tu cuenta no tiene permiso para hacer esto.'; return; }
    chError.textContent = 'Error al guardar: ' + err.message;
  }finally{
    btn.disabled = false; btn.textContent = 'Guardar';
  }
}

// Igual que aplicarClienteGuardado, pero para el array local `repartos`.
function aplicarChoferGuardado(choferGuardado, repartoOriginal){
  if(!choferGuardado) return;
  if(repartoOriginal){
    const idx = repartos.findIndex(r => String(r.Reparto) === String(repartoOriginal));
    if(idx >= 0) repartos[idx] = choferGuardado;
    else repartos.push(choferGuardado);
  }else{
    repartos.push(choferGuardado);
  }
}

function pedirConfirmacionEliminarChofer(reparto){
  confirmTitulo.textContent = 'Eliminar chofer';
  confirmTexto.textContent = `Se elimina el chofer de "${reparto}". Los clientes de ese reparto no se tocan, pero no se va a poder enviar el pedido hasta cargar otro chofer. No se puede deshacer.`;
  accionConfirmada = async () => {
    try{
      const r = repartos.find(x => String(x.Reparto) === String(reparto));
      if(!r){ alert('No se encontró el chofer a eliminar'); return; }
      await window.firestoreEliminarChofer(r.id);
      repartos = repartos.filter(x => x.id !== r.id);
      choferModal.classList.add('hidden');
      render();
    }catch(err){
      if(err && err.code === 'permission-denied'){ alert('Tu cuenta no tiene permiso para hacer esto.'); return; }
      alert('Error al eliminar: ' + err.message);
    }
  };
  confirmModal.classList.remove('hidden');
}

/* ============== Confirmaciones (eliminar cliente / vaciar) ============== */
const confirmModal = document.getElementById('confirm-modal');
const confirmTitulo = document.getElementById('confirm-titulo');
const confirmTexto = document.getElementById('confirm-texto');
let accionConfirmada = null;

document.getElementById('confirm-cancelar').addEventListener('click', () => confirmModal.classList.add('hidden'));
document.getElementById('confirm-aceptar').addEventListener('click', async () => {
  if(accionConfirmada) await accionConfirmada();
  confirmModal.classList.add('hidden');
});

function pedirConfirmacionEliminarCliente(nombreCliente){
  confirmTitulo.textContent = 'Eliminar cliente';
  confirmTexto.textContent = `Se elimina a "${nombreCliente}" junto con lo que tenga cargado en este pedido. No se puede deshacer.`;
  accionConfirmada = async () => {
    try{
      const c = pedidos.find(p => p.Cliente === nombreCliente);
      if(!c){ alert('No se encontró el cliente a eliminar'); return; }
      await window.firestoreEliminarCliente(c.id);
      pedidos = pedidos.filter(p => p.id !== c.id);
      clienteModal.classList.add('hidden');
      render();
    }catch(err){
      if(err && err.code === 'permission-denied'){ alert('Tu cuenta no tiene permiso para hacer esto.'); return; }
      alert('Error al eliminar: ' + err.message);
    }
  };
  confirmModal.classList.remove('hidden');
}

document.getElementById('btn-vaciar').addEventListener('click', () => {
  confirmTitulo.textContent = 'Vaciar cantidades';
  confirmTexto.textContent = 'Se borran las cantidades cargadas de TODOS los clientes para empezar un pedido nuevo. La lista de clientes no se toca. No se puede deshacer.';
  accionConfirmada = async () => {
    try{
      const vacio = {};
      CONFIG.PRODUCTOS.forEach(prod => { vacio[prod.codigo] = ''; });
      vacio.Estado = '';
      const actualizaciones = pedidos.map(p => ({ id: p.id, datos: vacio }));
      if(actualizaciones.length) await window.firestoreActualizarClientesEnLote(actualizaciones);
      pedidos.forEach(p => {
        CONFIG.PRODUCTOS.forEach(prod => { p[prod.codigo] = ''; });
        p.Estado = '';
      });
      render();
    }catch(err){
      if(err && err.code === 'permission-denied'){ alert('Tu cuenta no tiene permiso para hacer esto.'); return; }
      alert('Error al vaciar: ' + err.message);
    }
  };
  confirmModal.classList.remove('hidden');
});

/* ============== Enviar mensaje por reparto ============== */
function limpiarNumero(n){
  return String(n || '').replace(/[^0-9]/g, '');
}

async function enviarReparto(reparto){
  const repartoInfo = repartos.find(r => String(r.Reparto||'').trim() === reparto);
  if(!repartoInfo || !repartoInfo.WhatsApp){
    alert('Falta cargar el WhatsApp del chofer para este reparto en la pestaña "Choferes".');
    return;
  }
  const clientes = pedidos.filter(c =>
    (String(c.Reparto||'').trim() || 'Sin reparto') === reparto
    && tieneCantidades(c)
    && String(c.Estado || '').toLowerCase() !== 'enviado'
  );
  if(!clientes.length){
    alert('No hay pedidos nuevos para enviar en este reparto (ya están todos marcados como Enviado).');
    return;
  }

  const fecha = new Date();
  const fechaStr = String(fecha.getDate()).padStart(2,'0') + '/' + String(fecha.getMonth()+1).padStart(2,'0') + '/' + String(fecha.getFullYear()).slice(-2);
  let texto = `📦 *Pedidos ${reparto} ${fechaStr}*\n\n`;
  clientes.forEach(c => {
    const items = CONFIG.PRODUCTOS
      .filter(p => Number(c[p.codigo]) > 0)
      .map(p => formatearItemProducto(p, Number(c[p.codigo])))
      .join(' | ');
    texto += `👤 *${c.Cliente}*${c.Localidad ? ' (' + c.Localidad + ')' : ''}\n📞 ${c.Contacto || ''}\n📝 ${items}\n\n`;
  });

  const numero = limpiarNumero(repartoInfo.WhatsApp);
  const url = `https://api.whatsapp.com/send?phone=${numero}&text=${encodeURIComponent(texto)}`;
  window.open(url, '_blank');

  try{
    const actualizaciones = clientes.map(c => ({ id: c.id, datos: { Estado: 'Enviado' } }));
    await window.firestoreActualizarClientesEnLote(actualizaciones);
    clientes.forEach(c => { c.Estado = 'Enviado'; });
    render();
  }catch(err){
    // El mensaje ya se abrió igual; si falla marcar como enviado no es grave.
  }
}
